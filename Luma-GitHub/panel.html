<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none';">
<title>Luma</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<main>
  <header><div class="brand" dir="ltr"><img src="assets/luma-icon-128.png" width="26" height="26" alt=""><h1 lang="en">Luma</h1></div><span class="eyebrow">تنظیمات</span></header>
  <section class="setting" aria-label="تنظیم دسترسی">
    <div class="setting-label"><label id="switch-label" for="toggle">دسترسی <bdi lang="en">Flow</bdi></label><span id="mode">در حال بررسی…</span></div>
    <button id="toggle" class="switch" role="switch" aria-checked="false" aria-labelledby="switch-label" aria-describedby="mode" disabled><span class="switch-thumb" aria-hidden="true"></span></button>
  </section>
  <div id="status" class="status" role="status" aria-live="polite"><span class="status-dot status-dot--idle" aria-hidden="true"></span><span class="status-text">یک لحظه…</span></div>
  <footer><button id="reload" class="reload" hidden>بارگذاری مجدد صفحه<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M15.5 7A6 6 0 1 0 16 12M15.5 3.5V7H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><p class="hint">تغییرات پس از بارگذاری مجدد اعمال می‌شوند.</p></footer>
  <p id="error" class="error" role="alert"></p>
</main>
<script src="panel.js"></script>
</body>
</html>
